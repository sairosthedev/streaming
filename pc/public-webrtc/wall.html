<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Titan CCTV &middot; Wall</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0b0d10;
    --panel: #14171b;
    --line: #23272d;
    --text: #e6e8eb;
    --muted: #9aa2ab;
    --dim: #040a10;
    --live: #22c55e;
    --warn: #eab308;
    --error: #ef4444;
  }

  body {
    min-height: 100dvh;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .bar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .bar h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .bar .status { margin-left: auto; font-size: 13px; color: var(--muted); }
  .bar a { font-size: 13px; color: var(--muted); text-decoration: none; border: 1px solid var(--line); padding: 6px 12px; border-radius: 8px; }
  .bar a:hover { color: var(--text); border-color: #4b5259; }

  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--dim); }
  .dot.live  { background: var(--live);  box-shadow: 0 0 0 4px rgb(34 197 94 / 0.15); }
  .dot.wait  { background: var(--warn);  animation: pulse 1.4s ease-in-out infinite; }
  .dot.error { background: var(--error); box-shadow: 0 0 0 4px rgb(239 68 68 / 0.15); }

  @keyframes pulse { 50% { opacity: 0.35; } }

  .wall {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 12px;
  }

  .tile {
    position: relative;
    aspect-ratio: 16 / 9;
    background: #000;
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }

  .tile video { width: 100%; height: 100%; display: block; object-fit: contain; background: #000; }

  .label {
    position: absolute;
    left: 8px; top: 8px;
    display: flex; align-items: center; gap: 6px;
    background: rgb(0 0 0 / 0.55);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    color: var(--text);
    backdrop-filter: blur(2px);
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 16px;
    text-align: center;
    background: var(--bg);
  }
  .overlay[hidden] { display: none; }

  .spinner {
    width: 20px; height: 20px;
    margin: 0 auto 10px;
    border: 2px solid #2a2f36;
    border-top-color: #6b7480;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .overlay p { color: var(--muted); font-size: 13px; }

  .empty { color: var(--muted); font-size: 14px; padding: 40px; text-align: center; }

  .gatewrap {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: var(--bg);
    display: grid;
    place-items: center;
  }
  .gatewrap[hidden] { display: none; }
  form { display: flex; gap: 8px; justify-content: center; }
  input, .gatewrap button { font: inherit; border-radius: 8px; border: 1px solid var(--line); padding: 9px 14px; }
  input { width: 220px; background: var(--panel); color: var(--text); }
  input:focus { outline: none; border-color: #4b5259; }
  .gatewrap button { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 500; cursor: pointer; }
  .gatewrap button:hover { background: #fff; }
  .gatewrap button:disabled { opacity: 0.5; cursor: default; }
  .err { min-height: 1.4em; margin-top: 10px; font-size: 13px; color: #f87171; }
</style>
</head>
<body>
  <div class="bar">
    <span class="dot wait" id="dot"></span>
    <h1>Titan CCTV &middot; Wall</h1>
    <span class="status" id="status">Starting...</span>
    <a href="/">Single view</a>
  </div>

  <div id="gate" class="gatewrap" hidden>
    <div>
      <p style="margin-bottom:16px">This feed is password protected.</p>
      <form id="loginForm">
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
        <button type="submit" id="loginBtn">Watch</button>
      </form>
      <div class="err" id="loginError"></div>
    </div>
  </div>

  <div class="wall" id="wall"></div>

<script>
const dot        = document.getElementById('dot');
const statusEl   = document.getElementById('status');
const gate       = document.getElementById('gate');
const wall       = document.getElementById('wall');
const loginForm  = document.getElementById('loginForm');
const loginError = document.getElementById('loginError');
const loginBtn   = document.getElementById('loginBtn');
const passwordEl = document.getElementById('password');

function setStatus(state, text) {
  dot.className = 'dot ' + state;
  statusEl.textContent = text;
}

// One entry per camera: { cam, video, pc, retryDelay, tile }
const tiles = new Map();

async function boot() {
  const cfg = await (await fetch('/api/config')).json();

  if (cfg.requiresPassword && !cfg.authenticated) {
    gate.hidden = false;
    setStatus('wait', 'Locked');
    passwordEl.focus();
    return;
  }

  gate.hidden = true;
  await enter();
}

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  loginError.textContent = '';
  loginBtn.disabled = true;

  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: passwordEl.value }),
  });

  loginBtn.disabled = false;

  if (!res.ok) {
    loginError.textContent = 'Wrong password.';
    passwordEl.value = '';
    return;
  }

  gate.hidden = true;
  enter();
});

async function enter() {
  setStatus('wait', 'Loading cameras...');
  const cameras = await refreshCameras();

  if (!cameras.length) {
    setStatus('error', 'No cameras');
    wall.innerHTML = '<div class="empty">No cameras are configured. Add one on the server: npm run cameras -- add ...</div>';
    return;
  }

  for (const cam of cameras) buildTile(cam);
  setStatus('live', `${cameras.length} camera${cameras.length === 1 ? '' : 's'}`);

  setInterval(async () => {
    await refreshCameras();
  }, 10_000);
}

async function refreshCameras() {
  try {
    const res = await fetch('/api/cameras', { cache: 'no-store' });
    if (res.status === 401) { location.reload(); return []; }
    const data = await res.json();
    return data.cameras ?? [];
  } catch {
    return [...tiles.keys()].map((name) => ({ name }));
  }
}

function buildTile(cam) {
  const tile = document.createElement('div');
  tile.className = 'tile';

  const video = document.createElement('video');
  video.playsInline = true;
  video.muted = true;
  video.autoplay = true;

  const label = document.createElement('div');
  label.className = 'label';
  const labelDot = document.createElement('span');
  labelDot.className = 'dot';
  labelDot.style.width = '6px';
  labelDot.style.height = '6px';
  label.appendChild(labelDot);
  label.appendChild(document.createTextNode(cam.label ?? cam.name));

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = '<div><div class="spinner"></div><p>Connecting...</p></div>';

  tile.appendChild(video);
  tile.appendChild(overlay);
  tile.appendChild(label);
  wall.appendChild(tile);

  const entry = { cam, video, pc: null, retryDelay: 1000, tile, overlay, labelDot };
  tiles.set(cam.name, entry);
  connect(entry);
}

async function connect(entry) {
  cleanup(entry);

  entry.overlay.hidden = false;
  entry.overlay.querySelector('p').textContent = 'Connecting...';
  entry.labelDot.style.background = 'var(--warn)';

  const pc = new RTCPeerConnection({
    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],
  });
  entry.pc = pc;

  pc.addTransceiver('video', { direction: 'recvonly' });

  const stream = new MediaStream();

  pc.ontrack = (e) => {
    stream.addTrack(e.track);
    if (entry.video.srcObject !== stream) entry.video.srcObject = stream;
    entry.video.play().catch(() => {});
  };

  entry.video.addEventListener('playing', () => onPlaying(entry));

  pc.onconnectionstatechange = () => {
    if (entry.pc !== pc) return;

    if (pc.connectionState === 'connected') {
      entry.retryDelay = 1000;
    } else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
      entry.overlay.hidden = false;
      entry.overlay.querySelector('p').textContent = 'Reconnecting...';
      entry.labelDot.style.background = 'var(--warn)';
      setTimeout(() => { if (entry.pc === pc) connect(entry); }, entry.retryDelay);
      entry.retryDelay = Math.min(entry.retryDelay * 2, 15000);
    }
  };

  try {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await iceGatheringComplete(pc);

    const res = await fetch(`/webrtc/whep/${encodeURIComponent(entry.cam.name)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/sdp' },
      body: pc.localDescription.sdp,
    });

    if (res.status === 401) { location.reload(); return; }
    if (!res.ok) throw new Error(`server returned ${res.status}`);

    const answer = await res.text();
    await pc.setRemoteDescription({ type: 'answer', sdp: answer });

    watchForFrames(entry, pc);
  } catch (err) {
    entry.overlay.hidden = false;
    entry.overlay.querySelector('p').textContent = 'Connection failed';
    entry.labelDot.style.background = 'var(--error)';
    setTimeout(() => { if (entry.pc === pc) connect(entry); }, entry.retryDelay);
    entry.retryDelay = Math.min(entry.retryDelay * 2, 15000);
  }
}

function onPlaying(entry) {
  entry.overlay.hidden = true;
  entry.labelDot.style.background = 'var(--live)';
  entry.retryDelay = 1000;
}

function watchForFrames(entry, peer) {
  let elapsed = 0;
  const timer = setInterval(async () => {
    if (entry.pc !== peer) { clearInterval(timer); return; }

    elapsed += 2;
    let decoded = 0;
    let received = 0;
    const stats = await peer.getStats();
    stats.forEach((r) => {
      if (r.type === 'inbound-rtp' && r.kind === 'video') {
        decoded = r.framesDecoded ?? 0;
        received = r.bytesReceived ?? 0;
      }
    });

    if (decoded > 0) { clearInterval(timer); return; }

    if (elapsed >= 8) {
      clearInterval(timer);
      entry.overlay.hidden = false;
      entry.labelDot.style.background = 'var(--error)';
      entry.overlay.querySelector('p').textContent =
        received > 0 ? 'No video decoding' : 'No video data';
    }
  }, 2000);
}

function iceGatheringComplete(peer) {
  if (peer.iceGatheringState === 'complete') return Promise.resolve();
  return new Promise((resolve) => {
    const timer = setTimeout(resolve, 3000);
    peer.addEventListener('icegatheringstatechange', () => {
      if (peer.iceGatheringState === 'complete') { clearTimeout(timer); resolve(); }
    });
  });
}

function cleanup(entry) {
  if (entry.pc) {
    entry.pc.onconnectionstatechange = null;
    entry.pc.ontrack = null;
    entry.pc.close();
    entry.pc = null;
  }
  entry.video.srcObject = null;
}

window.addEventListener('beforeunload', () => {
  for (const entry of tiles.values()) cleanup(entry);
});

boot();
</script>
</body>
</html>
